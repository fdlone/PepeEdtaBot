# M3R-220 route gate (change route-gate): the associative route's promotion
# arms. Same knob values as the pilot (matrix_assoc_pilot.yaml) under a new
# prefix — the pilot and the gate answer different questions, and the gate
# was registered AFTER the pilot, so the pilot's reports cannot be re-read as
# a gate run.
#
# Arm ids start with C11: the prefix routes an arm to the route_gate block.
# The route under test is derived from the data (present in the arm's pools,
# absent from C0's), not from the arm id. Two modes; connectedness is read in
# ctx from the solo round (rating_rounds/assoc-gate).
#
# Expectation written before the run: the single-trajectory share in ctx
# (36% at C0) drops 3-6 p.p. at two slots; in noctx (6% at C0) there is
# little to move and the must-improve may not reach significance there.
configurations:
  - id: C0
    description: "Markov 1.x frozen baseline (registry defaults, flavor/emoji silenced)"
    available: true
    overrides:
      reply_flavor_strength: 0.0
      emoji_append_chance: 0.0

  - id: C11a20
    description: "M3R-220 route gate, assoc route ratio 0.2 (1 slot of 5)"
    available: true
    same_as: C0
    overrides:
      assoc_slot_ratio: 0.2
  - id: C11a40
    description: "M3R-220 route gate, assoc route ratio 0.4 (2 slots of 5)"
    available: true
    same_as: C0
    overrides:
      assoc_slot_ratio: 0.4
