# window escape printed. Expectation written before the run: flat on every
# metric within the protocol's resolution — the route already seeds the first
# two attempts from the same selection, and the third attempt's seed lands in
# a pool the route's candidates already cover.
configurations:
  - id: C0
    description: "registry defaults (route on, legacy draw 0.25), flavor/emoji silenced"
    available: true
    overrides:
      reply_flavor_strength: 0.0
      emoji_append_chance: 0.0

  - id: CL0
    description: "legacy L1 seed draw off (hot_ngram_seed_chance 0), route unchanged"
    available: true
    same_as: C0
    overrides:
      hot_ngram_seed_chance: 0.0
