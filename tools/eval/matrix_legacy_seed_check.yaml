# removed by the change it justified. Kept next to its report
# (eval_2026-09-11_legacy-seed-check_noctx.md) so the check stays reproducible
# from git history (checkout before 2026-09-11 hot-channel-write-gate).
# O22 group 4 (change hot-channel-write-gate): the legacy L1 seed draw
# (hot_ngram_seed_chance, one attempt per self-initiated reply with chance
# 0.25) next to the promoted hot route (2 attempts of 5 seeded by the route).
# The route was gated with the legacy draw at its default, so switching the
# draw off is an unmeasured change in noctx. One arm, noctx only (ctx never
