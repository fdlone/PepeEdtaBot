# Ablation configuration matrix (doc 05 §2).
#
# Each configuration = runtime-knob overrides on top of registry defaults.
# C0 is the FROZEN Markov 1.x baseline: registry defaults with the surface
# layers silenced (the established eval convention — reply_flavor_strength=0,
# emoji_append_chance=0 keep flavor/emoji out of content metrics). C0 is never
# edited after freezing; a new baseline gets a new id.
#
# C1–C5 are declared but unavailable until their phases land; the runner skips
# them and says so in the report (spec: "Before any V2 feature exists").
# CF aliases C0 while no V2 feature is enabled.
configurations:
  - id: C0
    description: "Markov 1.x frozen baseline (registry defaults, flavor/emoji silenced)"
    available: true
    overrides:
      reply_flavor_strength: 0.0
      emoji_append_chance: 0.0
  # Phase 2 landed but did not pass its gate: entropy sampling and the
  # branching-aware target both ship disabled, so C1 still resolves to C0.
  # Making it "available" here would add a column identical to C0 and imply a
  # feature is live when it is not. The calibration grid that produced the
  # verdict lives in matrix_phase2_grid.yaml, its numbers in
  # docs/eval_reports/eval_2026-08-12_phase2-verdict.md — re-enable this arm
  # only if a future phase changes the entropy distribution enough to retest.
  - id: C1
    description: "V2: entropy sampling only (Phase 2 — gate failed, ships disabled)"
    available: false
    same_as: C0
    overrides: {}
  # Same treatment as C1, for the same reason: Phase 3 ships the blend disabled
  # (every alpha default is 0), so an arm that "enables temporal blend" would be
  # C0 by construction and the runner would report an alias row. The grid that
  # produced the verdict lives in matrix_phase3_grid.yaml, its numbers in
  # docs/eval_reports/eval_2026-08-12_phase3-verdict.md — re-enable this arm
  # only after a live accumulation window gives the blend a corpus where more
  # than 1% of states offer a choice.
  - id: C2
    description: "V2: temporal blend only (Phase 3 — gate failed, ships disabled)"
    available: false
    same_as: C0
    overrides: {}
  # Phase 4 (M2R-300/310/320): meme-aware hot-ngram ordering + collocation
  # scoring. The runner populates the collocation registry on the DB copy
  # (analyze_chat_memes at the evaluation moment) before generating — a prod
  # process would have run its daily pass, and an empty registry would make
  # this arm C0 with extra steps. Weights 0.35: the scale of CLEAN_END_BONUS
  # and just above SELECTION_SCORE_MARGIN (0.3), so one intact meme can move
  # a candidate into or out of the selection window without drowning the
  # topicality term (cap 1.6). Not pre-registered as a gate number — the gate
  # conditions live in eval_thresholds.yaml; these are the treatment dose.
  - id: C3
    description: "V2: PMI memes + collocation scoring only (Phase 4)"
    available: true
    overrides:
      reply_flavor_strength: 0.0
      emoji_append_chance: 0.0
      markov_hot_ngram_meme_ordering: true
      markov_collocation_bonus: 0.35
      markov_collocation_break_penalty: 0.35
  # Phase 5 (M2R-410): seeded candidates from lexical anchoring. The runner
  # populates df from the copy's retained messages (window-approximated, since
  # df cannot be backfilled from full history) so the seeded branch has an IDF
  # to score with — enough to measure seeded_present_rate / win_rate, but NOT
  # the prod-accumulated df the promotion gate needs, so phase5_promotion stays
  # `insufficient data` until a live-accumulated run (design D4). Ratio 0.3
  # matches the pre-registered gate's null assumption (eval_thresholds.yaml).
  - id: C4
    description: "V2: lexical anchoring only (seeded generation, Phase 5)"
    available: true
    overrides:
      reply_flavor_strength: 0.0
      emoji_append_chance: 0.0
      markov_seeded_candidate_ratio: 0.3
  - id: C5
    description: "V2: entropy + blend (cumulative core)"
    available: false
    same_as: C0
    overrides: {}
  - id: CF
    description: "V2: all currently enabled features (none yet -> alias of C0)"
    available: true
    same_as: C0
    overrides: {}
