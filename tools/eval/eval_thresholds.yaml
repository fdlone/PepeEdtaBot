# Pre-registered gate thresholds (doc 05 §4).
#
# Fixed 2026-08-11, BEFORE any gated data was examined (pre-registration rule).
# Changing any number after this point requires a dedicated commit with written
# justification. Gate verdicts are computed strictly from this file.
#
# Rationale for the numbers is recorded here at registration time so a later
# reader can audit whether an edit was post-hoc.

phase2_entropy:
  # Registered 2026-08-12, BEFORE the Phase 2 calibration grid was run.
  # Roadmap doc 03 Phase 2 acceptance: "exact-copy не растёт, distinct-2/3
  # растут, p95 в бюджете". Encoded here as a four-part gate; an arm passes
  # only if ALL parts pass. Reference numbers are the frozen C0 baseline on
  # db_prod_copy 2026-07-13: copy 0.222, affinity_without_copy 0.209, p95 48 ms.
  #
  # Direction of each bound is stated explicitly because two of them are
  # one-sided "must not worsen" checks and two are "must improve" checks, and
  # confusing the two is how a null result gets read as a win.
  #
  # must-not-worsen: a SIGNIFICANT increase in copying disqualifies the arm
  # (same convention as phase7_order4). An insignificant rise is not a fail —
  # the protocol cannot resolve deltas below ~3 p.p. (doc 05 §8).
  exact_copy_delta_max: 0.0
  # must-improve: distinct-2 and distinct-3 must rise AND the rise must be
  # significant. An insignificant delta is a FAIL, not a pass: diversity is the
  # stated benefit of this phase, so "no measurable effect" means the phase did
  # not deliver. Comparable only within one run at equal basis — the report
  # prints distinct_basis_tokens for exactly this check.
  distinct2_delta_min: 0.0
  distinct3_delta_min: 0.0
  # must-not-worsen: topicality measured without copies may not drop
  # significantly. Paired with exact_copy_delta_max on purpose — affinity is
  # trivially inflated by copying, so the two are only meaningful together.
  affinity_without_copy_delta_floor: 0.0
  # TZ §17 budget; restated here so the Phase 2 verdict is computable from this
  # block alone. M2R-110 is expected to LOWER p95 (fewer attempts on degenerate
  # chains) — the check is that it does not raise it out of budget.
  latency_p95_ms_max: 150

phase3_temporal:
  # Registered 2026-08-12, BEFORE the Phase 3 grid was run and before the
  # temporal fixture produced a single number.
  #
  # Roadmap doc 03 Phase 3 acceptance: "свежий лексикон отражается быстрее
  # (временнóй срез); мем-регресс проходит". Encoded as a five-part gate; an arm
  # passes only if ALL parts pass.
  #
  # The gate is deliberately two-sided. A one-sided "freshness went up" bar
  # would pass an arm that simply forgets the chat — raising the fresh-token
  # share to 1.0 is trivial if the long layer stops mattering. Phase 2 taught
  # the matching lesson from the other direction: M2R-110 moved one metric in a
  # welcome direction while paying for it in another, and only the paired floor
  # made that visible as a trade rather than a win.
  #
  # must-improve: the share of generated tokens drawn from the fresh slice must
  # rise AND the rise must be significant. An insignificant delta is a FAIL —
  # reflecting fresh language is the stated benefit of this phase, so "no
  # measurable effect" means the phase did not deliver.
  freshness_delta_min: 0.0
  # must-not-worsen: n-grams from the historical slice must stay reproducible.
  # A significant drop disqualifies the arm. This is the meme-regression case of
  # TZ §19 expressed as a comparable rate rather than a pass/fail list, because
  # the gate needs a delta with an interval, not a boolean.
  historical_meme_delta_floor: 0.0
  # must-not-worsen, same convention and rationale as phase2_entropy: only a
  # SIGNIFICANT increase in copying disqualifies; the protocol cannot resolve
  # deltas below ~3 p.p. (doc 05 §8).
  exact_copy_delta_max: 0.0
  # must-not-worsen: topicality measured without copies may not drop
  # significantly. Paired with exact_copy_delta_max on purpose — affinity is
  # trivially inflated by copying, so the two are only meaningful together.
  affinity_without_copy_delta_floor: 0.0
  # TZ §17 budget, restated so this verdict is computable from this block alone.
  # The blend adds per-step work, so unlike Phase 2 this bound is expected to be
  # tested rather than comfortably cleared.
  latency_p95_ms_max: 150

phase5_promotion:
  # ADR-012 / TZ §9.6. A seeded candidate pool share of 0.3 means a "null"
  # seeded win rate of ~0.30 (winning its pool share = adding nothing), so the
  # win-rate bar is set meaningfully above the null, and the presence bar keeps
  # the denominator honest (doc 05 §3.4).
  seeded_present_rate_min: 0.30
  seeded_win_rate_given_present_min: 0.40
  # context_affinity_without_copy delta vs the no-seeded ablation must be
  # positive AND significant (CI excludes 0) — doc 05 §4 significance rule.
  affinity_without_copy_delta_min: 0.0
  latency_p95_ms_max: 150        # TZ §17 full-generation budget
  storage_growth_max_share: 0.35 # reverse order-2 ~ transitions table ~30% of DB

phase6_anticycle:
  # Two-dimensional gate (ADR-015): BOTH must exceed. Cycle != harm.
  cycle_detection_rate_min: 0.05
  cycle_harm_rate_min: 0.02

phase7_order4:
  # Shadow selector (Phase 1) must show order-4 actually being chosen, and the
  # exact-copy rate must not rise significantly in the shadow projection.
  order4_selected_share_min: 0.10
  exact_copy_delta_max: 0.0      # significant increase disqualifies

performance:
  # TZ §17, checked from Phase 1 onward on every protocol run.
  lookup_p95_ms_max: 10
  generation_p95_ms_max: 150
