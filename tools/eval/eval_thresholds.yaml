# Pre-registered gate thresholds (doc 05 §4).
#
# Fixed 2026-08-11, BEFORE any gated data was examined (pre-registration rule).
# Changing any number after this point requires a dedicated commit with written
# justification. Gate verdicts are computed strictly from this file.
#
# Rationale for the numbers is recorded here at registration time so a later
# reader can audit whether an edit was post-hoc.

phase2_entropy:
  # Registered 2026-08-12, BEFORE the Phase 2 calibration grid was run.
  # Roadmap doc 03 Phase 2 acceptance: "exact-copy не растёт, distinct-2/3
  # растут, p95 в бюджете". Encoded here as a four-part gate; an arm passes
  # only if ALL parts pass. Reference numbers are the frozen C0 baseline on
  # db_prod_copy 2026-07-13: copy 0.222, affinity_without_copy 0.209, p95 48 ms.
  #
  # Direction of each bound is stated explicitly because two of them are
  # one-sided "must not worsen" checks and two are "must improve" checks, and
  # confusing the two is how a null result gets read as a win.
  #
  # must-not-worsen: a SIGNIFICANT increase in copying disqualifies the arm
  # (same convention as phase7_order4). An insignificant rise is not a fail —
  # the protocol cannot resolve deltas below ~3 p.p. (doc 05 §8).
  exact_copy_delta_max: 0.0
  # must-improve: distinct-2 and distinct-3 must rise AND the rise must be
  # significant. An insignificant delta is a FAIL, not a pass: diversity is the
  # stated benefit of this phase, so "no measurable effect" means the phase did
  # not deliver. Comparable only within one run at equal basis — the report
  # prints distinct_basis_tokens for exactly this check.
  distinct2_delta_min: 0.0
  distinct3_delta_min: 0.0
  # must-not-worsen: topicality measured without copies may not drop
  # significantly. Paired with exact_copy_delta_max on purpose — affinity is
  # trivially inflated by copying, so the two are only meaningful together.
  affinity_without_copy_delta_floor: 0.0
  # TZ §17 budget; restated here so the Phase 2 verdict is computable from this
  # block alone. M2R-110 is expected to LOWER p95 (fewer attempts on degenerate
  # chains) — the check is that it does not raise it out of budget.
  latency_p95_ms_max: 150

phase3_temporal:
  # Registered 2026-08-12, BEFORE the Phase 3 grid was run and before the
  # temporal fixture produced a single number.
  #
  # Roadmap doc 03 Phase 3 acceptance: "свежий лексикон отражается быстрее
  # (временнóй срез); мем-регресс проходит". Encoded as a five-part gate; an arm
  # passes only if ALL parts pass.
  #
  # The gate is deliberately two-sided. A one-sided "freshness went up" bar
  # would pass an arm that simply forgets the chat — raising the fresh-token
  # share to 1.0 is trivial if the long layer stops mattering. Phase 2 taught
  # the matching lesson from the other direction: M2R-110 moved one metric in a
  # welcome direction while paying for it in another, and only the paired floor
  # made that visible as a trade rather than a win.
  #
  # must-improve: the share of generated tokens drawn from the fresh slice must
  # rise AND the rise must be significant. An insignificant delta is a FAIL —
  # reflecting fresh language is the stated benefit of this phase, so "no
  # measurable effect" means the phase did not deliver.
  freshness_delta_min: 0.0
  # must-not-worsen: n-grams from the historical slice must stay reproducible.
  # A significant drop disqualifies the arm. This is the meme-regression case of
  # TZ §19 expressed as a comparable rate rather than a pass/fail list, because
  # the gate needs a delta with an interval, not a boolean.
  historical_meme_delta_floor: 0.0
  # must-not-worsen, same convention and rationale as phase2_entropy: only a
  # SIGNIFICANT increase in copying disqualifies; the protocol cannot resolve
  # deltas below ~3 p.p. (doc 05 §8).
  exact_copy_delta_max: 0.0
  # must-not-worsen: topicality measured without copies may not drop
  # significantly. Paired with exact_copy_delta_max on purpose — affinity is
  # trivially inflated by copying, so the two are only meaningful together.
  affinity_without_copy_delta_floor: 0.0
  # TZ §17 budget, restated so this verdict is computable from this block alone.
  # The blend adds per-step work, so unlike Phase 2 this bound is expected to be
  # tested rather than comfortably cleared.
  latency_p95_ms_max: 150

phase4_memes:
  # Registered 2026-08-12, BEFORE any Phase 4 ranking was produced or rated.
  #
  # Doc 05 §5 fixes the manual protocol: the top-20 by meme_score are rated
  # "real local meme / merely frequent / junk", and the phase passes at >= 70%
  # real. That bar is the primary condition and it is NOT computable — the thing
  # this phase claims to improve (does the bot sound like THIS chat) is exactly
  # the thing no metric in this harness can see.
  #
  # Consequence encoded in the runner rather than left to discipline: while the
  # manual rating is missing the gate reports `insufficient data`, never `pass`.
  # An automatic-only verdict here would be a green light bought by measuring
  # the easy half.
  manual_real_share_min: 0.70
  # How many of the ranked memes must be rated. Rating fewer than the protocol's
  # top-20 and reporting the share would inflate it by letting the rater stop at
  # the good ones.
  manual_rated_min: 20
  # STRENGTHENED 2026-08-12, before any rating round was run and before any
  # Phase 4 ranking was rated — owner approved. Justification, recorded here
  # because the pre-registration rule requires an edit to explain itself:
  #
  # The absolute bar above measures the RATER as much as the algorithm. A lenient
  # rater marks more pairs "real" everywhere; a strict one marks fewer. The same
  # list given to two people can land at 60% and 80% and flip the verdict.
  #
  # Worse, the absolute bar does not test what M2R-310 claims. The roadmap says
  # "replace frequency selection WHERE IT WINS on eval". A pass at 75% while the
  # frequency ranking it replaces also scores 75% would mean swapping a mechanism
  # for an equivalent one and recording it as a success.
  #
  # So the rating round mixes the top-20 by meme_score with the top-20 by the
  # existing frequency selection, blind and shuffled, and this floor requires the
  # meme half to be NO WORSE than the frequency half. Deliberately "no worse"
  # rather than "significantly better": one binary judgement over 20 items has no
  # power to resolve a few positions, and a gate that no achievable evidence can
  # pass is a veto, not a gate. The actual delta is printed as a number and read
  # by a human — gated on what is provable, reported on what is interesting.
  manual_control_delta_floor: 0.0
  # Decoys (random pairs above the support threshold, in neither ranking) gate
  # the VALIDITY of the round, not the quality of the phase. If they are marked
  # "real" this often, the ratings are noise and neither share means anything —
  # so the verdict is `insufficient data`, NOT `fail`. A bad measurement is not a
  # failed phase, and merging those two outcomes is how "the round was junk" gets
  # remembered as "PMI does not work".
  manual_decoy_false_positive_max: 0.20
  # must-not-worsen, same convention and rationale as the earlier phases: only a
  # SIGNIFICANT move against us disqualifies, since the protocol cannot resolve
  # deltas below ~3 p.p. (doc 05 §8). Memes that raise copying are not memes,
  # they are quotes — this pairing is what tells the two apart.
  exact_copy_delta_max: 0.0
  affinity_without_copy_delta_floor: 0.0
  # TZ §17 budget, restated so this verdict is computable from this block alone.
  latency_p95_ms_max: 150

phase5_promotion:
  # ADR-012 / TZ §9.6. A seeded candidate pool share of 0.3 means a "null"
  # seeded win rate of ~0.30 (winning its pool share = adding nothing), so the
  # win-rate bar is set meaningfully above the null, and the presence bar keeps
  # the denominator honest (doc 05 §3.4).
  seeded_present_rate_min: 0.30
  seeded_win_rate_given_present_min: 0.40
  # context_affinity_without_copy delta vs the no-seeded ablation must be
  # positive AND significant (CI excludes 0) — doc 05 §4 significance rule.
  affinity_without_copy_delta_min: 0.0
  latency_p95_ms_max: 150        # TZ §17 full-generation budget
  storage_growth_max_share: 0.35 # reverse order-2 ~ transitions table ~30% of DB
  # ADDED 2026-09-01 by owner decision, BEFORE the M2R-430 verdict run (the
  # corpus precondition below is not met yet: n_docs 232 of 500). Legitimate
  # under the pre-registration rule for the same reason as phase9_interp's
  # flag: it can only turn a one-mode `pass` into `insufficient data`, never
  # loosen anything. Why the seeded channel needs both modes: its anchors come
  # from the current message, which is present in BOTH modes, so seeded is the
  # one Track A mechanism that acts on self-initiated replies too (the noctx
  # 11% of production, where after the L1 verdict it is the only topicality
  # source left). A ctx-only pass would be blind to exactly those replies.
  requires_both_modes: true
  # Corpus-sufficiency precondition (gate-phase5-ndocs-floor, registered
  # 2026-09-01, before any verdict run). Two parts because each is blind to the
  # other failure: volume alone repeats the retired ">=1000 phrases" bar (it
  # measured supply while selection decides), and a favourable singleton share
  # over a handful of documents is noise. Either part short => insufficient
  # data, never pass/fail. Both are read from the SOURCE snapshot before the
  # runner window-populates df in its working copy (design D1) — reading the
  # copy would always see the retention window and rubber-stamp the floor.
  #
  # n_docs_min: IDF's lever is the SPREAD between frequent and rare tokens,
  # log(n_docs/(1+df)). At 500 docs the head token (~34% of documents) gives
  # spread log(500/171) vs log(500/2) = 1.07 vs 5.52 — a scale ranking can
  # exist on. At the measured 35 docs the same spread is 1.07 vs 2.86 over a
  # corpus where 81% of tokens sit at one point.
  n_docs_min: 500
  # df_singleton_share_max is the WEAKER half, admitted here rather than
  # discovered later: 0.60 has no direct derivation from the formula — it is
  # chosen so that no less than 40% of the vocabulary has df > 1, i.e. the
  # discriminable part of the vocabulary is not a minority. Measured share on
  # 2026-08-24 is 0.81, comfortably beyond any random wobble. Moving this bar
  # later is allowed ONLY as a separate commit with rationale (pre-registration
  # rule) — an adjustment of a bar admitted weak up front, not a post-hoc fit.
  df_singleton_share_max: 0.60

meme_regression:
  # M3R-130, registered 2026-09-01 before any gated run (map §3.6).
  #
  # support_min: the set used to be built from chat_hot_ngrams ordered by cnt
  # DESC with NO support floor, so it was mostly one-off co-occurrences and the
  # set of non-reproduced memes drifted run to run — the gate measured luck.
  # Measured on the fresh prod copy: 1079 of 1097 rows have cnt = 1, 16 have
  # cnt = 2, 2 have cnt = 3. So 2 is not a soft pick — it is the only floor at
  # which a set still exists and is no longer made of single sightings.
  support_min: 2
  # reproduced_tolerance: the verdict is RELATIVE to C0 (share_arm below
  # share_C0 by more than this fails). An absolute bar was rejected with
  # precedent: phase 4's absolute 70% was met by neither arm and ended up
  # measuring the raters, not the algorithm; here it would measure how thick
  # the corpus is. With a set of ~1.5-2 dozen memes one meme is worth
  # 0.05-0.07, so 0.10 needs a two-meme gap before it fires.
  reproduced_tolerance: 0.10
  # set_min_size: below this the share is noise, not evidence — at five memes
  # the tolerance is smaller than the price of a single meme, which would make
  # the gate binary again while looking statistical. Eight is the smallest set
  # where one meme (0.125) is still commensurate with the tolerance.
  set_min_size: 8

phase6_anticycle:
  # Two-dimensional gate (ADR-015): BOTH must exceed. Cycle != harm.
  cycle_detection_rate_min: 0.05
  cycle_harm_rate_min: 0.02

phase7_order4:
  # Shadow selector (Phase 1) must show order-4 actually being chosen, and the
  # exact-copy rate must not rise significantly in the shadow projection.
  order4_selected_share_min: 0.10
  exact_copy_delta_max: 0.0      # significant increase disqualifies

phase9_interp:
  # Registered 2026-08-14, BEFORE the Phase 9 grid was run and before a single
  # interpolated generation was measured. Source of the conditions:
  # docs/v2/M2R_PHASE9_INTERPOLATION.md §7.
  #
  # Two-mode requirement (M3R-140, added 2026-08-14, still before any grid run).
  # The phase spec's noctx amendment already said the grid runs in both modes —
  # without a context bias steering the widened pools, incoherence is the risk
  # that mode carries and it has to be measured on its own. Until this change
  # the runner had no noctx mode at all, so the requirement had no way to bind.
  # It can only make a verdict stricter (`insufficient data` instead of `pass`)
  # and never looser, which is why adding it after registration is legitimate.
  requires_both_modes: true
  #
  # Why this phase gets a gate shaped differently from Phase 2/3: those two were
  # inert because 97.9% of order-3 states have exactly one continuation — there
  # was nothing to reweight. Interpolation is the first mechanism that CREATES
  # choice (simulated: deterministic steps 97.9% -> 72.7% at beta 0.30). So the
  # target metric finally has a mechanism to move, and the risk flips from
  # "nothing happens" to "diversity bought with incoherence". The gate is
  # two-sided on quality for exactly that reason.
  #
  # must-improve: distinct-2 AND distinct-3 must rise significantly. Same
  # convention as phase2_entropy — an insignificant delta is a FAIL, because
  # diversity is the stated benefit. Comparable only within one run at equal
  # basis (the report prints distinct_basis_tokens).
  distinct2_delta_min: 0.0
  distinct3_delta_min: 0.0
  # must-not-worsen: only a SIGNIFICANT rise in copying disqualifies (the
  # protocol cannot resolve deltas below ~3 p.p., doc 05 §8). A drop is expected
  # here — wider pools mean fewer verbatim replays — but is not required.
  exact_copy_delta_max: 0.0
  # must-not-worsen, and DELIBERATELY DIFFERENT from the earlier phases: this is
  # a bound on the CI LOWER BOUND, not on the point estimate. Earlier gates ask
  # "did topicality drop significantly"; here the question is "how much drop can
  # we not rule out". Interpolation is expected to cost some topicality by
  # construction (order-2 knows less about the state), so a small measured drop
  # is acceptable while an unbounded one is not. -0.02 is the same class of
  # protection that rejected M2R-110, expressed as a tolerance rather than zero.
  affinity_without_copy_delta_ci_low_min: -0.02
  # must-not-worsen: repetition may not rise significantly.
  repetition_delta_max: 0.0
  # Safety, not a target: the Phase 6 verdict (cycles 0.0001) was measured on a
  # different walk topology, and interpolation changes that topology. An arm that
  # brings cycles back above this rate fails regardless of its diversity.
  cycle_detection_rate_max: 0.05
  # TZ §17 budget. Expected to be tested rather than cleared: merging two
  # distributions is per-step work, and C4 already sits at p95 ~119 ms.
  latency_p95_ms_max: 150
  # Connectedness round (spec §8). Substantive bar: the share of replies rated
  # "coherent" may not fall more than 10 p.p. below C0.
  #
  # The instrument is the M3R-020 solo protocol, NOT a rater panel. Recorded
  # here because the pre-registration rule requires an edit to explain itself:
  # the spec originally asked for >=3 raters with Fleiss' kappa >= 0.4, which
  # references an instrument the project does not have — a panel of >=3
  # disinterested raters is unavailable (PRE roadmap §3), and the one attempt is
  # already measured: agreement 0.17 in Phase 4 made that verdict elastic. The
  # roadmap updated after that finding; the phase spec had not. Fixed 2026-08-14
  # by owner decision BEFORE this registration — legitimate under the
  # pre-registration rule, which forbids moving thresholds after data is seen,
  # not repairing a reference to a nonexistent tool before a run.
  #
  # The substantive bar below is unchanged by that fix. Only validity moves:
  # from panel agreement to self-consistency.
  manual_connected_delta_floor: -0.10
  # Validity of the round, not quality of the phase: at least this share of the
  # sample is presented twice, and the rater must agree with themselves at least
  # this often. Below it the round is NOT counted — verdict `insufficient data`,
  # never `fail`. A bad measurement is not a failed phase; merging those two is
  # how "the round was junk" gets remembered as "interpolation does not work".
  manual_repeat_share_min: 0.20
  manual_self_consistency_min: 0.80
  # ADDED 2026-09-01 (M3R-020), before the first solo round was prepared and
  # before a single rating existed. The two bars above check that the rater
  # agrees with THEMSELVES; neither checks that the rubric separates a connected
  # reply from an unconnected one — a rater who says "3" to everything is
  # perfectly self-consistent. So part of the sample is a real reply of the same
  # run with its tokens shuffled, and this is the share of those that must be
  # rated unconnected. Like the two bars above it gates the VALIDITY of the
  # round, not the phase: below it the verdict is `insufficient data`, never
  # `fail`, and the diagnosis differs — "the rubric does not discriminate", not
  # "the rater is unstable".
  #
  # 0.80 mirrors manual_self_consistency_min rather than phase 4's decoy bar:
  # phase 4 asks how often a decoy is mistaken for a meme (a judgement about
  # borderline material), while a token-shuffled reply is not borderline — it is
  # the unambiguous case, and a rubric that misses one in five of them cannot be
  # trusted on the ambiguous ones.
  manual_decoy_detected_min: 0.80
  # Minimum replies rated per arm (spec §8). Rating fewer and reporting the
  # share would inflate it by letting the rater stop early.
  manual_rated_min: 30

structural_escape:
  # M3R-011, registered 2026-08-14 BEFORE the metric produced a single number.
  # This is the project's headline gate (PRE roadmap, Success criteria): PRE is
  # structurally successful only if an input yields >= 2 substantially different
  # trajectories INSIDE the selection window — not variants of one nearly
  # deterministic path.
  #
  # Why it is registered now rather than with the first route: a route grid that
  # arrives before the gate would report "quality rose by X%" with no answer to
  # whether the space rose at all, and the threshold would then be chosen with
  # the numbers already in view.
  #
  # "Substantially different" = edge overlap below this value, where overlap is
  # the share of shared adjacent content-token pairs normalized by the smaller
  # of the two sets. 0.5 reads as "half the walk is shared" — the same walk with
  # a different tail rather than a different walk. Chosen by argument, not by
  # data, and therefore frozen: moving it later would be fitting the ruler to
  # the result. A different value means a differently NAMED gate.
  edge_overlap_similar: 0.5
  # The headline bar, as a mean over the run: >= 2 different trajectories in the
  # window. If the C0 baseline itself comes out below this, that is the finding
  # — the current configuration does not clear the project's main gate — and NOT
  # a reason to lower the number.
  window_escape_min: 2.0
  # Safety invariant of the roadmap (ECB >= 4/5 over the pool), so that a change
  # which raises window diversity by shrinking the pool cannot pass. The
  # roadmap's C0 reference is 4.73/4.68 from the R1 reconnaissance, whose JSON
  # never entered the repository; 4.0 is a floor, not a target, and comparability
  # with those numbers is not claimed.
  pool_ecb_min: 4.0
  # M3R-140: the window is defined through the score, and the scorer's scale
  # differs between modes (map §1.2) — so the window's width does too. A
  # one-mode verdict would be especially misleading here.
  requires_both_modes: true

performance:
  # TZ §17, checked from Phase 1 onward on every protocol run.
  lookup_p95_ms_max: 10
  generation_p95_ms_max: 150

l1_hot_channel:
  # M3R-145, registered 2026-09-01 BEFORE the L1 grid (matrix_l1_grid.yaml)
  # was run and before the harness had produced a single seeded generation
  # (change l1-hot-channel-sweep). Rationale per number, so a later reader can
  # audit whether an edit was post-hoc.
  #
  # The channel is dead by data at the default thresholds (map §3.2б; live
  # /stats 2026-09-01: hot phrases empty in 100% of draws). The grid lowers the
  # SELECTION thresholds; the draw probability stays at its default.
  #
  # Two modes, and the gate is asymmetric by construction: the pipeline never
  # seeds addressed replies, and addressed replies are the ones that carry
  # context — so the seed draw exists in noctx only, and ctx measures the other
  # half of the same knobs (which tokens slot mutations protect).
  requires_both_modes: true
  # Coverage (roadmap §4 template), noctx: share of successful generations
  # whose walk actually STARTED from the seed — not the share of draws. A drawn
  # n-gram anchors a walk only when it opens a stored start, and the census
  # says 3-5 of the top 8 do; at a 0.25 draw chance the reachable ceiling is
  # 9-16%. Below 5% the arm touched too few replies for the protocol to resolve
  # its effect (~3 p.p., doc 05 §8): verdict `insufficient data`, never pass.
  seed_start_share_min: 0.05
  # must-improve, noctx: historical_meme_rate must rise AND the rise must be
  # significant. Circularity admitted up front: the meme set (M3R-130) and the
  # seed pool share the support floor 2, so this measures whether a drawn meme
  # SURVIVES to the reply through finalization, the verbatim penalty and
  # selection — which is the channel's question (R4: the nine memes never
  # appear in any candidate). An insignificant delta is a FAIL: reproducing
  # local memes is the stated benefit, "no measurable effect" means the channel
  # still has nothing to say.
  meme_rate_delta_min: 0.0
  # must-not-worsen, both modes: only a SIGNIFICANT rise disqualifies (same
  # convention as every earlier gate; the protocol cannot resolve below ~3
  # p.p.). Seeds are corpus phrases by construction, so copy is the risk this
  # channel carries and the pairing with the must-improve above is deliberate.
  exact_copy_delta_max: 0.0
  repetition_delta_max: 0.0
  # must-not-worsen, ctx: topicality without copies may not drop significantly.
  # In ctx the knobs change only the protected tokens of slot mutations; a
  # significant drop there would mean the protection is breaking replies.
  affinity_without_copy_delta_floor: 0.0
  # TZ §17 budget, restated so the verdict is computable from this block alone.
  latency_p95_ms_max: 150
  # Connectedness, noctx only (the channel produces text there; in ctx it
  # changes nothing a rater could see). Same instrument and floor as phase 9:
  # the M3R-020 solo round, share of "coherent" replies may not fall more than
  # 10 p.p. below C0. Validity of the round is read from the phase9_interp
  # block by the round tool itself (its design: one set of validity bars).
  # Without a round the noctx verdict is `insufficient data`, never `pass`.
  manual_connected_delta_floor: -0.10

pool_composition:
  # M3R-110, registered 2026-09-01 BEFORE the pool grid
  # (matrix_pool_grid_1.yaml, matrix_pool_grid_2.yaml) was run (change
  # pool-composition-sweep). Rationale per number, so a later reader can audit
  # whether an edit was post-hoc.
  #
  # The grid moves three ctx-only knobs (context start bias, anchor splice
  # share, attempts with context). They are inert without context, so the
  # noctx half of this gate measures inertness and keeps the two-mode weighting
  # honest rather than measuring an effect.
  requires_both_modes: true
  # Coverage (roadmap §4 template), ctx: the knobs claim to shift the start
  # budget from global starts to contextual ones, so the measured share of
  # successful replies whose winner started from context (context / hidden
  # context / spliced anchor) must MOVE against C0 by at least this much. An
  # arm that did not move it changed nothing it claims to change; whatever its
  # affinity delta says is noise or a side effect — verdict `insufficient
  # data`, never pass. 5 p.p. is the protocol's resolution class (~3 p.p. at
  # n=500, doc 05 §8) with margin.
  context_start_share_delta_min: 0.05
  # must-improve, ctx: topicality without copies must rise AND the rise must be
  # significant. An insignificant delta is a FAIL — moving the budget toward
  # contextual starts is the stated benefit, "no measurable effect" means the
  # arm did not deliver. Paired with the copy bound below on purpose: affinity
  # is trivially inflated by copying.
  affinity_without_copy_delta_min: 0.0
  # must-not-worsen, both modes: only a SIGNIFICANT rise disqualifies (same
  # convention as every earlier gate). Contextual starts retrace the corpus
  # around the prompt, so copy is the price this grid could pay.
  exact_copy_delta_max: 0.0
  repetition_delta_max: 0.0
  # Safety invariant of the roadmap (ECB >= 4/5 over the pool), same absolute
  # floor as structural_escape.pool_ecb_min and comparable for the same reason
  # (the slot budget keeps the pool at five, O10).
  pool_ecb_min: 4.0
  # must-not-worsen, ctx: the window escape count may not drop significantly.
  # M3R-011 located the bottleneck in the selection window (2.169 in ctx with
  # 36% of inputs at one trajectory); a knob that buys topicality by narrowing
  # the window further is exactly the trade the roadmap warns against.
  window_escape_delta_floor: 0.0
  # TZ §17 budget, restated so the verdict is computable from this block alone.
  latency_p95_ms_max: 150
  # Connectedness, ctx only (the arms change text only with context). Same
  # instrument and floor as phase 9: the M3R-020 solo round, share of
  # "coherent" replies may not fall more than 10 p.p. below C0. Without a round
  # the ctx verdict is `insufficient data`, never `pass`.
  manual_connected_delta_floor: -0.10

knob_census:
  # M3R-151, registered 2026-09-02 BEFORE the census was run (change
  # knob-census). Classification rule for every measurable knob, from the
  # paired deltas of its domain extremes against C0 in both modes.
  #
  # inert: at EVERY measured extreme, EVERY classification metric's delta
  # interval lies inside [-tol, +tol]. A CI-containment rule, not a point
  # rule: an insignificant delta with a wide interval is "not resolved", not
  # "inert" — and "not resolved" reads as weak, never as inert.
  # strong: at least one extreme has a SIGNIFICANT delta whose |point| is at
  # or above the strength bar on some metric.
  # weak: everything else.
  # gated: extremes inert with the parent knob at its default and not inert
  # with the parent enabled.
  # dead: not read on any live path (static check, no run).
  #
  # Tolerances per metric family. Shares: 0.01 is a third of the protocol's
  # resolution at n=500 (~3 p.p., doc 05 §8) and n here is 1500 per arm.
  # Trajectory counts (escape / ECB): 0.05 on a scale where the C0 window sits
  # at ~2.0-2.9 and the headline gate resolves 0.1. Length: 0.3 tokens on a
  # mean of ~10.5.
  tolerance:
    context_affinity_without_copy: 0.01
    exact_context_copy_rate: 0.01
    repetition_rate: 0.01
    historical_meme_rate: 0.01
    structural_window_escape: 0.05
    structural_pool_ecb: 0.05
    mean_response_length: 0.3
  # Strength bars: a knob is "strong" when it can move a metric by at least
  # this much — the class where a domain ceiling matters more than removal.
  strong:
    context_affinity_without_copy: 0.03
    exact_context_copy_rate: 0.03
    repetition_rate: 0.03
    historical_meme_rate: 0.03
    structural_window_escape: 0.15
    structural_pool_ecb: 0.15
    mean_response_length: 1.0

selection_window:
  # M3R-100, registered 2026-09-02 BEFORE the selection grid
  # (matrix_selection_grid_{1,2}.yaml) was run (change selection-window-grid).
  # The hypothesis under test: the ctx selection window — not the chain — is
  # where candidate diversity collapses (M3R-011: pool ECB ~4.5, window ~2,
  # 36% of inputs with a single trajectory in the window; M3R-110: every
  # context knob that raised topicality narrowed the window). The arms move
  # the window itself: the margin, the relevance weight/cap and a diversity
  # bonus for trajectories distinct from the best-scored one.
  requires_both_modes: true
  # Coverage, in the form M3R-011 promised for the route gate: the share of
  # inputs whose window holds a SINGLE trajectory must drop by at least this
  # much (paired delta, negative). A mean escape that rises while the same
  # third of inputs stays at one trajectory would be diversity for the inputs
  # that already had it.
  single_trajectory_share_delta_max: -0.05
  # must-improve: the window escape count must rise AND the rise must be
  # significant. An insignificant delta is a FAIL — widening the window is the
  # stated benefit, "no measurable effect" means the arm did not deliver.
  window_escape_delta_min: 0.0
  # must-not-worsen (the roadmap's success criterion: affinity not below the
  # best single configuration): topicality without copies may not drop
  # significantly. Deliberately a significance floor, not a CI-low tolerance:
  # a wider window is expected to cost topicality by construction, and the
  # question is whether it does so measurably.
  affinity_without_copy_delta_floor: 0.0
  # must-not-worsen, both modes: same convention as every earlier gate.
  exact_copy_delta_max: 0.0
  repetition_delta_max: 0.0
  # Safety invariant of the roadmap, same absolute floor as structural_escape.
  pool_ecb_min: 4.0
  # TZ §17 budget, restated so the verdict is computable from this block alone.
  latency_p95_ms_max: 150
  # Connectedness, ctx (the arms change which candidate wins, i.e. the text a
  # rater sees). Same instrument and floor as phase 9.
  manual_connected_delta_floor: -0.10

assoc_pilot:
  # M3R-200 PILOT (change assoc-route-pilot), registered 2026-09-02 BEFORE the
  # pilot grid (matrix_assoc_pilot.yaml) was run. These are VIABILITY bars for
  # a pilot that answers four questions; they are not a promotion gate and the
  # verdict vocabulary is viable / not viable / insufficient data — never pass.
  # Promotion (M3R-220) gets its own block later, with the connectedness round
  # and the "share of inputs below 2" escape form.
  requires_both_modes: true
  # Q1 builds: share of generations with a pool in which the route placed at
  # least one candidate. Below the floor the pilot did not exercise the route
  # and nothing about it can be read: insufficient data, whatever the deltas.
  # Expectation written before the run: 30-40% at two slots (seeded at 0.3
  # gave 21.9% of the pool).
  present_share_min: 0.10
  # Q2 space: paired delta of the pool ECB. The route DISPLACES walk slots, so
  # an associate that only re-creates a walk trajectory lowers the count. A
  # significant drop is the one outcome that makes the route not viable on
  # this question; the window escape delta is printed alongside, no bar.
  pool_ecb_delta_floor: 0.0
  # Q3 cost: TZ §17 budget, the same number every gate uses.
  latency_p95_ms_max: 150
  # Q4 signal: copy and repetition are must-not-worsen (a significant rise
  # disqualifies, the usual convention); affinity without copies is printed
  # with its CI and has NO bar here — the pilot reads its sign, the promotion
  # gate will set the floor.
  exact_copy_delta_max: 0.0
  repetition_delta_max: 0.0
