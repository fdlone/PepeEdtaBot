# Not a distributable package: [project] exists to pin the supported Python
# floor (CI matrix 3.12-3.14). Dependencies live in requirements*.txt (pip is
# the source of truth for CI and Docker); uv is only a local runner, so
# project management (lock/sync) is disabled below.
[project]
name = "pepe-edta-bot"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
managed = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/domain/pivo_templates.py" = ["E501"]
"tools/seed_db.py" = ["E402", "E501"]
"tools/seed_diverse.py" = ["E402", "E501"]

[tool.bandit]
# B311 (non-crypto `random`) fires on every dice roll in the generation path and
# in the dev seeding/eval scripts — 23 hits, all benign. The crypto in this
# project never touches `random`: the /pivo HMAC and Fernet keys are derived from
# the .env secrets, and Fernet draws its own IV from os.urandom. Skipping the
# check keeps a future *real* low finding (a swallowed exception, say) visible
# instead of buried. If randomness is ever needed for a secret, use `secrets`.
skips = ["B311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.*"
strict = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Ratchet: keep coverage from regressing (current ~89% branch). Raise as it grows.
fail_under = 87
show_missing = true
skip_covered = true
