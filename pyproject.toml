[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/domain/pivo_templates.py" = ["E501"]
"app/infrastructure/database.py" = ["UP045"]
"tools/seed_db.py" = ["E402", "E501"]
"tools/seed_diverse.py" = ["E402", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.*"
strict = true
