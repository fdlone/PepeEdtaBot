name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app/ tests/ tools/ main.py

      - name: Type check (mypy)
        run: python -m mypy app/

      - name: Run unit tests (with coverage)
        run: |
          python -m coverage run -m unittest discover tests -v
          python -m coverage report

      - name: Security scan (bandit)
        run: python -m bandit -c pyproject.toml -r app tools main.py -x tests --severity-level medium --confidence-level medium

      - name: Dependency scan (pip-audit)
        run: python -m pip_audit -r requirements.lock

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pepe-bot:latest .
