name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per commit: pushes build only main, feature branches build through
# their PR (2026-07-16, owner decision — the unfiltered-push variant doubled
# every PR's CI and was rolled back). The known cost is that a branch without
# an open PR is not built; open the PR early if that matters. Rapid re-pushes
# to the same ref cancel the stale run; pushes to main never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app/ tests/ tools/ main.py

      - name: Type check (mypy)
        run: python -m mypy app/

      - name: Run unit tests (with coverage)
        run: |
          python -m coverage run -m unittest discover tests -v
          python -m coverage report

      # Markov 2.0R eval smoke (docs/v2/05 §7): C0+CF on the synthetic
      # snapshot, 40 generations, 1 seed. Gates only on runner errors and
      # invariant violations, never on metric thresholds. One matrix cell is
      # enough — the smoke checks the pipeline, not the interpreter.
      - name: Eval protocol smoke (Markov 2.0R)
        if: matrix.python-version == '3.12'
        run: python -m tools.eval --smoke

      # Generation baseline guard. The prod copy never leaves the owner's
      # machine, so the recorded value is anchored on the synthetic snapshot —
      # that is what makes it checkable here, on the commit that moves it,
      # instead of being noticed weeks later against a constant quoted in prose.
      # A legitimate move is a deliberate edit of tools/generation_hash_baseline.json
      # stating which change moved it and why; anything else fails this step.
      - name: Generation baseline (byte-identical output)
        if: matrix.python-version == '3.12'
        run: python -m tools.generation_hash --synthetic --check

      - name: Security scan (bandit)
        run: python -m bandit -c pyproject.toml -r app tools main.py -x tests --severity-level medium --confidence-level medium

      - name: Dependency scan (pip-audit)
        run: python -m pip_audit -r requirements.lock

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t pepe-bot:latest .

      # Dockerfile копирует белый список файлов, а не весь контекст. Сборка
      # остаётся зелёной, даже если из образа выпало что-то нужное, поэтому
      # проверяем, что импорты живые и миграции на месте: без них бот падает
      # уже в рантайме, при первом подключении к БД.
      - name: Smoke-test image
        run: |
          host_migrations=$(ls app/migrations | grep -cE '^[0-9]{3}_\w+\.(sql|py)$')
          docker run --rm --entrypoint python pepe-bot:latest -c "
          import main  # noqa: F401 -- every runtime module must be importable
          from app.infrastructure.migrator import _MIGRATIONS_DIR, _MIGRATION_RE
          found = [p.name for p in _MIGRATIONS_DIR.iterdir() if _MIGRATION_RE.match(p.name)]
          assert len(found) == $host_migrations, f'migrations in image: {len(found)}, expected $host_migrations'
          print(f'ok: {len(found)} migrations')
          "
