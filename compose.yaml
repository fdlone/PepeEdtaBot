services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pepe-bot
    image: pepe-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Драйвер json-file по умолчанию не ротирует ничего. Дело не в месте на
    # диске: в дефолтном режиме бот пишет единицы КБ в сутки. Дело в том, что
    # при GEN_TRACE_LOG=true в лог уходят тексты кандидатов, то есть контент
    # чата (~0.4 МБ в сутки), и он копится в /var/lib/docker/containers/*/*.log
    # открытым текстом бессрочно. .dockerignore держит *.log вне образа, а этот
    # канал не ограничен ничем — «включил трейс разобраться, забыл выключить»
    # превращается в бессрочное хранилище переписки на хосте.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
